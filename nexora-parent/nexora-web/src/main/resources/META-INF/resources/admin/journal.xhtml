<ui:composition template="/WEB-INF/templates/admin.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:pt="http://xmlns.jcp.org/jsf/passthrough">
<f:metadata>
    <f:event type="preRenderView" listener="#{acces.exigerJournal}" />
</f:metadata>
<ui:param name="section" value="journal" />
<ui:define name="titre">Journal d'actions</ui:define>
<ui:define name="titre-page">Journal d'actions</ui:define>
<ui:define name="content">

    <ui:fragment rendered="#{not empty journalBean.erreur}">
        <div class="nx-alert nx-alert-error">#{journalBean.erreur}</div>
    </ui:fragment>

    <div class="nx-card">
        <h:form id="filtres" style="display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;">
            <div class="nx-field" style="margin:0;">
                <label for="filtres:module">Module</label>
                <h:selectOneMenu id="module" value="#{journalBean.module}" styleClass="nx-select">
                    <f:selectItem itemLabel="Tous" itemValue="" />
                    <f:selectItems value="#{journalBean.modules}" />
                </h:selectOneMenu>
            </div>
            <div class="nx-field" style="margin:0; flex:1; min-width:220px;">
                <label for="filtres:recherche">Recherche (auteur, action, description)</label>
                <h:inputText id="recherche" value="#{journalBean.recherche}" styleClass="nx-input" />
            </div>
            <h:commandButton value="Filtrer" action="#{journalBean.filtrer}" styleClass="nx-button nx-button-primary" />
        </h:form>
    </div>

    <div class="nx-card">
        <ui:fragment rendered="#{empty journalBean.resultat.actions}">
            <p style="color:var(--nx-text-secondary);">Aucune action.</p>
        </ui:fragment>
        <ui:include src="/WEB-INF/includes/journal-tableau.xhtml">
            <ui:param name="actions" value="#{journalBean.resultat.actions}" />
            <ui:param name="detaille" value="true" />
        </ui:include>

        <div style="display:flex; justify-content:space-between; margin-top:14px;">
            <h:link outcome="/admin/journal" value="← Plus récentes" rendered="#{journalBean.page gt 0}" styleClass="nx-button nx-button-outline">
                <f:param name="page" value="#{journalBean.page - 1}" />
                <f:param name="module" value="#{journalBean.module}" disable="#{empty journalBean.module}" />
                <f:param name="recherche" value="#{journalBean.recherche}" disable="#{empty journalBean.recherche}" />
            </h:link>
            <span></span>
            <h:link outcome="/admin/journal" value="Plus anciennes →" rendered="#{journalBean.resultat.pageSuivante}" styleClass="nx-button nx-button-outline">
                <f:param name="page" value="#{journalBean.page + 1}" />
                <f:param name="module" value="#{journalBean.module}" disable="#{empty journalBean.module}" />
                <f:param name="recherche" value="#{journalBean.recherche}" disable="#{empty journalBean.recherche}" />
            </h:link>
        </div>
    </div>

</ui:define>
</ui:composition>
