<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<!-- Carte d'une offre dans une grille de résultats (recherche par mots, par photo, articles similaires).
     Paramètres : o (OffreSummaryResponse) ; ressemblance (facultatif, 0 à 1) affiche un badge. -->
<h:link outcome="/offre" styleClass="nx-offre-card">
    <f:param name="id" value="#{o.id}" />
    <div class="nx-offre-media">
        <ui:fragment rendered="#{not empty ressemblance}">
            <span class="nx-ressemblance #{ressemblance ge 0.6 ? 'forte' : ''}" title="Ressemblance avec la photo">#{format.ressemblance(ressemblance)}</span>
        </ui:fragment>
        <ui:fragment rendered="#{!empty o.imagePrincipale}">
            <img src="#{o.imagePrincipale}" alt="#{o.titre}" loading="lazy" />
        </ui:fragment>
        <ui:fragment rendered="#{empty o.imagePrincipale}">
            <svg class="nx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 3h8l10 10-8 8L3 11V3z"/><circle cx="7.5" cy="7.5" r="1.3" fill="currentColor" stroke="none"/>
            </svg>
        </ui:fragment>
    </div>
    <div class="nx-offre-body">
        <span class="nx-offre-espace">
            #{o.espaceNom}
            <ui:fragment rendered="#{o.espaceVerifie}">
                <span class="nx-badge nx-badge-verifie">
                    <svg class="nx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
                    Vérifié
                </span>
            </ui:fragment>
            <ui:fragment rendered="#{o.espaceCertifie}">
                <span class="nx-badge nx-badge-certifie">
                    <svg class="nx-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5l2.7 6.4 6.9.6-5.2 4.6 1.6 6.8L12 17.3 5.9 20.9l1.6-6.8-5.2-4.6 6.9-.6L12 2.5z"/></svg>
                    Certifié
                </span>
            </ui:fragment>
        </span>
        <span class="nx-offre-titre">#{o.titre}</span>
        <span class="nx-offre-prix">
            <ui:fragment rendered="#{o.ancienPrix != null}">
                <span class="nx-old">#{format.prix(o.ancienPrix)}</span>
            </ui:fragment>
            #{format.prix(o.prix)}
        </span>
        <span class="nx-offre-footer">
            <span class="nx-inline-icon">
                <svg class="nx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/>
                </svg>
                #{o.localisationCourte}<ui:fragment rendered="#{o.distanceKm != null}"><span class="nx-distance"> · #{format.distance(o.distanceKm)}</span></ui:fragment>
            </span>
            <ui:fragment rendered="#{o.espaceOuvertMaintenant eq true}"><span class="nx-ouverture ouvert">Ouvert</span></ui:fragment>
            <ui:fragment rendered="#{o.espaceOuvertMaintenant eq false}"><span class="nx-ouverture">Fermé</span></ui:fragment>
            <ui:fragment rendered="#{o.enPromotion}"><span class="nx-badge nx-badge-promo">Promo</span></ui:fragment>
        </span>
    </div>
</h:link>
</ui:composition>
