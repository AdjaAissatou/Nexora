<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
    <!-- Liste de catégories (paramètre : noeuds) avec leurs compteurs, §9.11 -->
    <table class="nx-verif-tableau">
        <ui:fragment rendered="#{not empty noeuds}">
            <tr><th>Catégorie</th><th>Sous-catégories</th><th>Types d'offre</th><th>Attributs</th><th>Offres</th></tr>
        </ui:fragment>
        <ui:repeat var="n" value="#{noeuds}">
            <tr class="#{n.actif ? '' : 'nx-cat-inactif'}">
                <td><h:link outcome="/admin/catalogue" value="#{n.nom}" style="font-weight:700;"><f:param name="id" value="#{n.id}" /></h:link>
                    <ui:fragment rendered="#{!n.actif}"> <span class="nx-badge nx-badge-alerte">Désactivée</span></ui:fragment></td>
                <td>#{n.sousCategories}</td><td>#{n.typesOffre}</td><td>#{n.attributs}</td><td>#{n.offres}</td>
            </tr>
        </ui:repeat>
    </table>
</ui:composition>
