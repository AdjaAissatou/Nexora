<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><ui:insert name="titre">Nexora</ui:insert></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet" />
    <h:outputStylesheet library="css" name="nexora-theme.css" />
</h:head>
<h:body>
    <header class="nx-navbar">
        <div class="nx-container">
            <h:link outcome="/index" class="nx-brand">
                Nexora<span class="nx-dot">.</span>
            </h:link>
            <nav class="nx-nav-links">
                <h:link outcome="/index" value="Accueil" />
                <h:link outcome="/recherche" value="Rechercher" />
                <ui:fragment rendered="#{sessionBean.connecte}">
                    <span>Bonjour, #{sessionBean.prenom}</span>
                    <h:form>
                        <h:commandLink value="Déconnexion" action="#{sessionBean.deconnecterEtRediriger}" />
                    </h:form>
                </ui:fragment>
                <ui:fragment rendered="#{!sessionBean.connecte}">
                    <h:link outcome="/connexion" value="Connexion" />
                    <h:link outcome="/inscription" styleClass="nx-nav-cta" value="Créer un compte" />
                </ui:fragment>
            </nav>
        </div>
    </header>

    <main style="flex:1;">
        <ui:insert name="content" />
    </main>

    <footer class="nx-footer">
        <div class="nx-container">
            © #{format.anneeCourante} Nexora — la plateforme qui connecte les espaces professionnels du Sénégal.
        </div>
    </footer>
</h:body>
</html>
