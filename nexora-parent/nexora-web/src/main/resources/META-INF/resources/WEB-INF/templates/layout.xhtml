<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>

    <meta charset="UTF-8" />

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0" />

    <title>
        <ui:insert name="titre">Nexora</ui:insert>
    </title>

    <!-- Police -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com" />

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin="anonymous" />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Playfair+Display:wght@600;700&amp;display=swap"
          rel="stylesheet" />

    <!-- Theme Nexora -->
    <h:outputStylesheet
            library="css"
            name="nexora-theme.css" />

    <ui:insert name="head-extra" />

    <!-- Page restaurée par le bouton « Retour » depuis la mémoire du navigateur : on la recharge
         depuis le serveur, qui sait si l'on est encore connecté. -->
    <script>window.addEventListener('pageshow', function (e) { if (e.persisted) window.location.reload(); });</script>
</h:head>

<h:body>

    <!-- Bandeau d'annonce : paramètre SITE_BANDEAU (§9.12), vide = aucun bandeau -->
    <ui:fragment rendered="#{not empty site.bandeau}">
        <div class="nx-bandeau" role="status">#{site.bandeau}</div>
    </ui:fragment>

    <!-- ========================= -->
    <!-- NAVBAR -->
    <!-- ========================= -->

    <header class="nx-navbar">

        <div class="nx-container nx-navbar-inner">

            <!-- Logo -->
            <h:link outcome="/index"
                    styleClass="nx-brand">

                <span class="nx-brand-name">
                    Nexora
                </span>

                <span class="nx-brand-mark">.</span>

            </h:link>


            <!-- Navigation -->
            <nav class="nx-nav-links">

                <h:link outcome="/index"
                        value="Accueil"
                        styleClass="nx-nav-link" />

                <h:link outcome="/explorer"
                        value="Explorer"
                        styleClass="nx-nav-link" />

                <h:link outcome="/decouvrir"
                        value="✨ Découvrir"
                        styleClass="nx-nav-link nx-nav-decouvrir" />

                <h:link outcome="/recherche"
                        value="Rechercher"
                        styleClass="nx-nav-link" />


                <!-- Utilisateur connecté -->
                <ui:fragment rendered="#{sessionBean.connecte}">

                    <div class="nx-user-menu">

                        <h:link outcome="/mon-compte"
                                value="Mon compte"
                                styleClass="nx-nav-link" />

                        <!-- Réservé aux comptes FOURNISSEUR (au moins un espace) : docs/architecture-acteurs.md §4 -->
                        <h:link outcome="/mon-espace"
                                value="Mon espace"
                                styleClass="nx-nav-link"
                                rendered="#{sessionBean.fournisseur}" />

                        <!-- Agent de vérification : son espace de travail, sans lien vers l'administration (§8.1) -->
                        <h:link outcome="/verifications/index"
                                value="Vérifications"
                                styleClass="nx-nav-link"
                                rendered="#{sessionBean.agentVerification}" />

                        <!-- Rôles du back-office (docs/architecture-acteurs.md §9.2) -->
                        <h:link outcome="/admin/index"
                                value="Administration"
                                styleClass="nx-nav-link"
                                rendered="#{acces.backOffice}" />

                        <span class="nx-user-greeting">
                            Bonjour, #{sessionBean.prenom}
                        </span>

                        <h:form>

                            <h:commandLink
                                    value="Déconnexion"
                                    action="#{sessionBean.deconnecterEtRediriger}"
                                    styleClass="nx-nav-link nx-logout" />

                        </h:form>

                    </div>

                </ui:fragment>


                <!-- Utilisateur non connecté -->
                <ui:fragment rendered="#{!sessionBean.connecte}">

                    <h:link outcome="/connexion"
                            value="Connexion"
                            styleClass="nx-nav-link" />

                    <h:link outcome="/inscription"
                            value="Créer un compte"
                            styleClass="nx-nav-cta" />

                </ui:fragment>

            </nav>

        </div>

    </header>


    <!-- ========================= -->
    <!-- CONTENU -->
    <!-- ========================= -->

    <main class="nx-main">

        <ui:insert name="content" />

    </main>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="nx-footer">

        <div class="nx-container">

            <div class="nx-footer-main">

                <div>

                    <div class="nx-footer-brand">
                        Nexora<span>.</span>
                    </div>

                    <p>
                        Découvrez. Connectez.
                        Faites vivre le local.
                    </p>

                </div>


                <div class="nx-footer-links">

                    <h4>Explorer</h4>

                    <h:link outcome="/index"
                            value="Accueil" />

                    <h:link outcome="/recherche"
                            value="Rechercher" />

                    <h:link outcome="/explorer"
                            value="Explorer" />

                    <h:link outcome="/decouvrir"
                            value="Découvrir" />

                </div>


                <div class="nx-footer-links">

                    <h4>Nexora</h4>

                    <h:link outcome="/connexion"
                            value="Connexion" />

                    <h:link outcome="/inscription"
                            value="Créer un compte" />

                </div>


                <div class="nx-footer-links">

                    <h4>Contact</h4>

                    <a href="mailto:#{site.contactEmail}">#{site.contactEmail}</a>

                    <ui:fragment rendered="#{not empty site.contactTelephone}">
                        <a href="tel:#{site.contactTelephone.replace(' ', '')}">#{site.contactTelephone}</a>
                    </ui:fragment>

                </div>

            </div>


            <div class="nx-footer-bottom">

                <span>
                    © #{format.anneeCourante} Nexora
                </span>

                <span class="nx-footer-credit">
                    Photos d'ambiance : <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a>
                </span>

                <span>
                    Sénégal 🇸🇳
                </span>

            </div>

        </div>

    </footer>

</h:body>

</html>
