<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:metadata>
    <f:event type="preRenderView" listener="#{sessionBean.exigerConnexion}" />
</f:metadata>
<ui:define name="titre">Créer mon espace — Nexora</ui:define>
<ui:define name="content">

    <section class="nx-page-header">
        <div class="nx-container">
            <h1>Créer mon espace professionnel</h1>
            <p>Présentez votre activité aux visiteurs de Nexora.</p>
        </div>
    </section>

    <div class="nx-container" style="padding:28px 0 80px;">
        <div class="nx-card" style="max-width:640px; margin:0 auto;">

            <h:form id="creerEspace">
                <h:messages errorClass="nx-alert nx-alert-error" warnClass="nx-alert nx-alert-warn" layout="table" />

                <div class="nx-field">
                    <label for="creerEspace:type">Catégorie</label>
                    <h:selectOneMenu id="type" value="#{creerEspaceBean.typeEspaceId}" styleClass="nx-select" required="true"
                                     requiredMessage="Choisissez une catégorie.">
                        <f:selectItem itemLabel="Choisir une catégorie…" itemValue="#{null}" />
                        <f:selectItems value="#{creerEspaceBean.types}" var="t" itemLabel="#{t.nom}" itemValue="#{t.id}" />
                        <f:converter converterId="jakarta.faces.Long" />
                    </h:selectOneMenu>
                </div>

                <div class="nx-field">
                    <label for="creerEspace:nom">Nom de l'espace</label>
                    <h:inputText id="nom" value="#{creerEspaceBean.nom}" styleClass="nx-input" required="true"
                                 requiredMessage="Le nom est obligatoire." />
                </div>

                <div class="nx-field">
                    <label for="creerEspace:slogan">Slogan</label>
                    <h:inputText id="slogan" value="#{creerEspaceBean.slogan}" styleClass="nx-input" />
                </div>

                <div class="nx-field">
                    <label for="creerEspace:description">Description</label>
                    <h:inputTextarea id="description" value="#{creerEspaceBean.description}" styleClass="nx-input" />
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 12px;">
                    <div class="nx-field">
                        <label for="creerEspace:telephone">Téléphone</label>
                        <h:inputText id="telephone" value="#{creerEspaceBean.telephone}" placeholder="77 123 45 67" styleClass="nx-input" />
                    </div>
                    <div class="nx-field">
                        <label for="creerEspace:telephoneSecondaire">Téléphone secondaire</label>
                        <h:inputText id="telephoneSecondaire" value="#{creerEspaceBean.telephoneSecondaire}" styleClass="nx-input" />
                    </div>
                </div>

                <div class="nx-field">
                    <label for="creerEspace:email">Adresse email</label>
                    <h:inputText id="email" value="#{creerEspaceBean.email}" styleClass="nx-input" />
                </div>

                <div class="nx-field">
                    <label for="creerEspace:siteWeb">Site web</label>
                    <h:inputText id="siteWeb" value="#{creerEspaceBean.siteWeb}" placeholder="www.monsite.sn" styleClass="nx-input" />
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 12px;">
                    <div class="nx-field">
                        <label for="creerEspace:logo">Logo <span style="font-weight:400; color:var(--nx-text-secondary);">(lien vers une image)</span></label>
                        <h:inputText id="logo" value="#{creerEspaceBean.logo}" placeholder="https://…/logo.jpg" styleClass="nx-input" />
                        <ui:fragment rendered="#{not empty creerEspaceBean.logo}">
                            <img src="#{creerEspaceBean.logo}" alt="Aperçu du logo" style="margin-top:8px; width:64px; height:64px; object-fit:cover; border-radius:50%; border:1px solid var(--nx-border);" />
                        </ui:fragment>
                    </div>
                    <div class="nx-field">
                        <label for="creerEspace:couverture">Photo de couverture <span style="font-weight:400; color:var(--nx-text-secondary);">(lien vers une image)</span></label>
                        <h:inputText id="couverture" value="#{creerEspaceBean.couverture}" placeholder="https://…/couverture.jpg" styleClass="nx-input" />
                        <ui:fragment rendered="#{not empty creerEspaceBean.couverture}">
                            <img src="#{creerEspaceBean.couverture}" alt="Aperçu de la couverture" style="margin-top:8px; width:100%; max-width:220px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--nx-border);" />
                        </ui:fragment>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:0 12px;">
                    <div class="nx-field">
                        <label for="creerEspace:rc">Registre de commerce</label>
                        <h:inputText id="rc" value="#{creerEspaceBean.registreCommerce}" styleClass="nx-input" />
                    </div>
                    <div class="nx-field">
                        <label for="creerEspace:ninea">NINEA</label>
                        <h:inputText id="ninea" value="#{creerEspaceBean.numeroNinea}" styleClass="nx-input" />
                    </div>
                    <div class="nx-field">
                        <label for="creerEspace:rccm">RCCM</label>
                        <h:inputText id="rccm" value="#{creerEspaceBean.numeroRccm}" styleClass="nx-input" />
                    </div>
                </div>

                <div class="nx-field">
                    <label for="creerEspace:photos">Photos du lieu <span style="font-weight:400; color:var(--nx-text-secondary);">(une URL d'image par ligne)</span></label>
                    <h:inputTextarea id="photos" value="#{creerEspaceBean.photosTexte}" placeholder="https://…/photo1.jpg&#10;https://…/photo2.jpg" styleClass="nx-input" rows="3" />
                </div>

                <h3 style="margin-top:20px;">Localisation</h3>
                <p style="color:var(--nx-text-secondary); font-size:.9em; margin-top:-8px;">
                    Essentielle pour que les visiteurs vous trouvent près de chez eux.
                </p>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 12px;">
                    <div class="nx-field">
                        <label for="creerEspace:region">Région</label>
                        <h:selectOneMenu id="region" value="#{creerEspaceBean.idRegion}" styleClass="nx-select" required="true"
                                         requiredMessage="Choisissez une région.">
                            <f:selectItem itemLabel="Choisir…" itemValue="#{null}" />
                            <f:selectItems value="#{creerEspaceBean.regions}" var="r" itemLabel="#{r.nom}" itemValue="#{r.id}" />
                            <f:converter converterId="jakarta.faces.Long" />
                            <f:ajax listener="#{creerEspaceBean.onRegionChange}" render="departementBloc communeBloc" />
                        </h:selectOneMenu>
                    </div>
                    <h:panelGroup id="departementBloc" layout="block" styleClass="nx-field">
                        <label for="creerEspace:departement">Département</label>
                        <h:selectOneMenu id="departement" value="#{creerEspaceBean.idDepartement}" styleClass="nx-select"
                                         required="true" requiredMessage="Choisissez un département." disabled="#{empty creerEspaceBean.departements}">
                            <f:selectItem itemLabel="Choisir…" itemValue="#{null}" />
                            <f:selectItems value="#{creerEspaceBean.departements}" var="d" itemLabel="#{d.nom}" itemValue="#{d.id}" />
                            <f:converter converterId="jakarta.faces.Long" />
                            <f:ajax listener="#{creerEspaceBean.onDepartementChange}" render="communeBloc" />
                        </h:selectOneMenu>
                    </h:panelGroup>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 12px;">
                    <h:panelGroup id="communeBloc" layout="block" styleClass="nx-field">
                        <label for="creerEspace:commune">Commune</label>
                        <h:selectOneMenu id="commune" value="#{creerEspaceBean.idCommune}" styleClass="nx-select"
                                         required="true" requiredMessage="Choisissez une commune." disabled="#{empty creerEspaceBean.communes}">
                            <f:selectItem itemLabel="Choisir…" itemValue="#{null}" />
                            <f:selectItems value="#{creerEspaceBean.communes}" var="c" itemLabel="#{c.nom}" itemValue="#{c.id}" />
                            <f:converter converterId="jakarta.faces.Long" />
                        </h:selectOneMenu>
                    </h:panelGroup>
                    <div class="nx-field">
                        <label for="creerEspace:quartier">Quartier</label>
                        <h:inputText id="quartier" value="#{creerEspaceBean.quartier}" placeholder="ex. Sacré-Cœur 3" styleClass="nx-input"
                                     required="true" requiredMessage="Le quartier est obligatoire." />
                    </div>
                </div>

                <div class="nx-field">
                    <label for="creerEspace:adresseComplete">Adresse complète <span style="font-weight:400; color:var(--nx-text-secondary);">(repère, numéro de porte…)</span></label>
                    <h:inputText id="adresseComplete" value="#{creerEspaceBean.adresseComplete}" placeholder="ex. Villa n°12, en face de la pharmacie" styleClass="nx-input" />
                </div>

                <h:commandButton value="Créer mon espace" action="#{creerEspaceBean.creer}" styleClass="nx-button nx-button-primary nx-button-block" />
            </h:form>

        </div>
    </div>

</ui:define>
</ui:composition>
