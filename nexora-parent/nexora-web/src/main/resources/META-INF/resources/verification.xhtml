<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<f:metadata>
    <f:viewParam name="email" value="#{verificationBean.email}" />
</f:metadata>
<ui:define name="titre">Vérifier mon compte — Nexora</ui:define>
<ui:define name="content">
    <div class="nx-auth-wrap">
        <div class="nx-auth-card">

            <ui:fragment rendered="#{verificationBean.verifie}">
                <h1>Compte vérifié ✓</h1>
                <p class="nx-sub">Votre adresse email est confirmée. Vous pouvez maintenant vous connecter.</p>
                <h:link outcome="/connexion" value="Se connecter →" styleClass="nx-button nx-button-primary nx-button-block" />
            </ui:fragment>

            <ui:fragment rendered="#{!verificationBean.verifie}">
                <h1>Vérifier votre compte</h1>
                <p class="nx-sub">
                    Un code à usage unique vous a été envoyé par email. Saisissez-le ci-dessous pour activer votre compte.
                </p>

                <h:form id="verification">
                    <h:messages errorClass="nx-alert nx-alert-error" warnClass="nx-alert nx-alert-warn" layout="table" />

                    <div class="nx-field">
                        <label for="verification:email">Adresse email</label>
                        <h:inputText id="email" value="#{verificationBean.email}" styleClass="nx-input" required="true" />
                    </div>

                    <div class="nx-field">
                        <label for="verification:otp">Code reçu par email</label>
                        <h:inputText id="otp" value="#{verificationBean.otp}" styleClass="nx-input" required="true"
                                     placeholder="123456" />
                    </div>

                    <h:commandButton value="Vérifier mon compte" action="#{verificationBean.verifier}" styleClass="nx-button nx-button-primary nx-button-block" />
                </h:form>
            </ui:fragment>

            <p class="nx-auth-footer">
                <h:link outcome="/connexion" value="Retour à la connexion" />
            </p>
        </div>
    </div>
</ui:define>
</ui:composition>
