<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:define name="titre">Créer un compte — Nexora</ui:define>
<ui:define name="content">
    <div class="nx-auth-wrap">
        <div class="nx-auth-card" style="max-width:480px;">

            <ui:fragment rendered="#{inscriptionBean.succes}">
                <h1 style="display:flex; align-items:center; gap:10px;">
                    Compte créé
                    <svg class="nx-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:22px; height:22px; color:var(--nx-primary);">
                        <path d="M5 13l4 4L19 7"/>
                    </svg>
                </h1>
                <p class="nx-sub">#{inscriptionBean.messageSucces}</p>
                <ui:fragment rendered="#{inscriptionBean.verificationRequise}">
                    <h:link outcome="/verification" value="Vérifier mon compte →" styleClass="nx-button nx-button-primary nx-button-block">
                        <f:param name="email" value="#{inscriptionBean.email}" />
                    </h:link>
                </ui:fragment>
                <ui:fragment rendered="#{!inscriptionBean.verificationRequise}">
                    <h:link outcome="/connexion" value="Se connecter →" styleClass="nx-button nx-button-primary nx-button-block" />
                </ui:fragment>
            </ui:fragment>

            <ui:fragment rendered="#{!inscriptionBean.succes}">
                <h1>Rejoindre Nexora</h1>
                <p class="nx-sub">Créez votre compte pour rechercher, contacter et suivre vos espaces favoris.</p>
            </ui:fragment>

            <h:form id="inscription" rendered="#{!inscriptionBean.succes}">
                <h:messages errorClass="nx-alert nx-alert-error" warnClass="nx-alert nx-alert-warn" layout="table" />

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                    <div class="nx-field">
                        <label for="inscription:prenom">Prénom</label>
                        <h:inputText id="prenom" value="#{inscriptionBean.prenom}" styleClass="nx-input" required="true" />
                    </div>
                    <div class="nx-field">
                        <label for="inscription:nom">Nom</label>
                        <h:inputText id="nom" value="#{inscriptionBean.nom}" styleClass="nx-input" required="true" />
                    </div>
                </div>

                <div class="nx-field">
                    <label for="inscription:email">Adresse email</label>
                    <h:inputText id="email" value="#{inscriptionBean.email}" styleClass="nx-input" required="true" />
                </div>

                <div class="nx-field">
                    <label for="inscription:telephone">Téléphone</label>
                    <h:inputText id="telephone" value="#{inscriptionBean.telephone}" placeholder="77 123 45 67" styleClass="nx-input" />
                </div>

                <div class="nx-field">
                    <label for="inscription:motDePasse">Mot de passe</label>
                    <h:inputSecret id="motDePasse" value="#{inscriptionBean.motDePasse}" styleClass="nx-input" required="true" redisplay="true" />
                </div>

                <div class="nx-field">
                    <label for="inscription:confirmation">Confirmer le mot de passe</label>
                    <h:inputSecret id="confirmation" value="#{inscriptionBean.confirmationMotDePasse}" styleClass="nx-input" required="true" redisplay="true" />
                </div>

                <h:commandButton value="Créer mon compte" action="#{inscriptionBean.inscrire}" styleClass="nx-button nx-button-primary nx-button-block" />
            </h:form>

            <p class="nx-auth-footer">
                Déjà un compte ? <h:link outcome="/connexion" value="Se connecter" />
            </p>
        </div>
    </div>
</ui:define>
</ui:composition>
