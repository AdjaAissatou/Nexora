<ui:composition template="/WEB-INF/templates/layout.xhtml"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                 xmlns:p="http://primefaces.org/ui">
<ui:define name="titre">Connexion — Nexora</ui:define>
<ui:define name="content">
    <div class="nx-auth-wrap">
        <div class="nx-card nx-auth-card">
            <h1>Content de vous revoir</h1>
            <p class="nx-sub">Connectez-vous pour accéder à votre compte Nexora.</p>

            <h:form id="connexion">
                <p:messages showDetail="true" closable="true" />

                <div class="nx-field">
                    <label for="connexion:email">Adresse email</label>
                    <p:inputText id="email" value="#{connexionBean.email}" styleClass="nx-input" required="true"
                                 requiredMessage="L'adresse email est obligatoire." />
                </div>

                <div class="nx-field">
                    <label for="connexion:motDePasse">Mot de passe</label>
                    <p:password id="motDePasse" value="#{connexionBean.motDePasse}" styleClass="nx-input" required="true"
                                requiredMessage="Le mot de passe est obligatoire." feedback="false" />
                </div>

                <p:commandButton value="Se connecter" action="#{connexionBean.connecter}" styleClass="nx-btn-block" ajax="false" />
            </h:form>

            <p style="margin-top:20px; font-size:14px; text-align:center; color:var(--nx-text-secondary);">
                Pas encore de compte ?
                <h:link outcome="/inscription" value="Créer un compte" style="color:var(--nx-primary); font-weight:700;" />
            </p>
        </div>
    </div>
</ui:define>
</ui:composition>
