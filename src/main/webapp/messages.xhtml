<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <ui:param name="titre" value="#{msg['nav.messages']}"/>
    <ui:define name="content">
        <div class="view">
            <div class="page-head reveal"><h1 style="font-size:24px">#{msg['msg.title']}</h1></div>
            <div class="panel reveal" style="margin-top:16px">
                <p class="meta" style="padding:8px 0">#{msg['msg.empty']}</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
