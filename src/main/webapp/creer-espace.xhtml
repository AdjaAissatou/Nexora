<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:a="jakarta.faces.passthrough">
    <ui:param name="titre" value="Créer mon espace"/>
    <ui:define name="content">
        <div class="view">
            <h:link styleClass="back-btn" outcome="accueil"><svg class="ic"><use href="#ic-back"/></svg><span>Retour</span></h:link>
            <div class="page-head reveal">
                <span class="eyebrow">Espace professionnel</span>
                <h1>Créer mon espace</h1>
                <p>Un espace unique pour votre activité : vous pourrez y publier des produits et des services.</p>
            </div>

            <h:form styleClass="nx-form reveal">
                <h:messages globalOnly="true" styleClass="meta" style="color:var(--danger);margin-bottom:12px"/>

                <div class="nx-field">
                    <label>Nom commercial *</label>
                    <h:inputText value="#{espaceBean.nomCommercial}" a:placeholder="Ex : Chez Awa"/>
                </div>
                <div class="nx-field">
                    <label>Ville</label>
                    <h:selectOneMenu value="#{espaceBean.ville}">
                        <f:selectItem itemValue="Dakar" itemLabel="Dakar"/>
                        <f:selectItem itemValue="Thiès" itemLabel="Thiès"/>
                        <f:selectItem itemValue="Saint-Louis" itemLabel="Saint-Louis"/>
                        <f:selectItem itemValue="Touba" itemLabel="Touba"/>
                        <f:selectItem itemValue="Ziguinchor" itemLabel="Ziguinchor"/>
                        <f:selectItem itemValue="Mbour" itemLabel="Mbour"/>
                    </h:selectOneMenu>
                </div>
                <div class="nx-field">
                    <label>Téléphone</label>
                    <h:inputText value="#{espaceBean.telephone}" a:placeholder="+221 ..."/>
                </div>

                <h:commandButton styleClass="btn btn-primary" value="Créer mon espace" action="#{espaceBean.creer}"/>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
