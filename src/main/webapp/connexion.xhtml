<?xml version="1.0" encoding="UTF-8"?>
<ui:composition template="/WEB-INF/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">
    <ui:param name="titre" value="#{msg['auth.login']}"/>
    <ui:define name="content">
        <div class="view">
            <div class="page-head reveal">
                <span class="eyebrow">#{msg['auth.eyebrow']}</span>
                <h1>#{auth.register ? msg['auth.register'] : msg['auth.login']}</h1>
                <p>#{auth.register ? msg['auth.register.sub'] : msg['auth.login.sub']}</p>
            </div>

            <h:form styleClass="nx-form reveal">
                <h:messages globalOnly="true" layout="table" styleClass="meta" style="color:var(--danger);margin-bottom:12px"/>
                <h:inputHidden value="#{auth.dest}"/>

                <h:panelGroup layout="block" styleClass="nx-field" rendered="#{auth.register}">
                    <label>#{msg['auth.name']}</label>
                    <h:inputText value="#{auth.nom}" a:placeholder="Ex : Adja Diop" xmlns:a="jakarta.faces.passthrough"/>
                </h:panelGroup>
                <div class="nx-field">
                    <label>#{msg['auth.email']}</label>
                    <h:inputText value="#{auth.email}" a:type="email" a:placeholder="vous@exemple.com" xmlns:a="jakarta.faces.passthrough"/>
                </div>
                <div class="nx-field">
                    <label>#{msg['auth.password']}</label>
                    <h:inputSecret value="#{auth.motDePasse}" a:placeholder="********" xmlns:a="jakarta.faces.passthrough"/>
                </div>

                <h:commandButton styleClass="btn btn-primary" style="width:100%"
                                 value="#{auth.register ? msg['auth.register.btn'] : msg['auth.login.btn']}"
                                 action="#{auth.seConnecter}"/>

                <div style="text-align:center;margin-top:14px">
                    <h:commandLink value="#{auth.register ? msg['auth.toLogin'] : msg['auth.toRegister']}"
                                   action="#{auth.basculer}" styleClass="meta" style="color:var(--emerald-600)">
                        <f:ajax render="@form"/>
                    </h:commandLink>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
