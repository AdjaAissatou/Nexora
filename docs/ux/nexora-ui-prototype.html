/* ============ TOKENS ============ */
:root{
  --emerald:#10B981; --emerald-600:#059669; --emerald-700:#047857;
  --emerald-50:#ECFDF5; --emerald-100:#D1FAE5;
  --nuit:#1E3A8A; --nuit-700:#1E40AF;
  --danger:#EF4444; --amber:#F59E0B;
  --bg:#FFFFFF; --surface:#F8FAFC; --surface-2:#F1F5F9; --surface-3:#E9EEF5;
  --card:#FFFFFF;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --border:rgba(15,23,42,.08); --border-2:rgba(15,23,42,.12);
  --glass:rgba(255,255,255,.72);
  --shadow-sm:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --shadow-md:0 8px 24px -10px rgba(16,40,34,.18);
  --shadow-lg:0 24px 60px -20px rgba(16,40,34,.28);
  --shadow-emerald:0 14px 30px -12px rgba(5,150,105,.45);
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  --sidebar:270px; --ease:cubic-bezier(.22,.61,.36,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0A0F1C; --surface:#0E1626; --surface-2:#131D30; --surface-3:#1B283F; --card:#0F1A2B;
    --text:#F1F5F9; --text-2:#A9B6C9; --text-3:#6B7A90;
    --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14); --glass:rgba(16,24,38,.66);
    --emerald-50:rgba(16,185,129,.12); --emerald-100:rgba(16,185,129,.20);
    --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -24px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F1C; --surface:#0E1626; --surface-2:#131D30; --surface-3:#1B283F; --card:#0F1A2B;
  --text:#F1F5F9; --text-2:#A9B6C9; --text-3:#6B7A90;
  --border:rgba(255,255,255,.08); --border-2:rgba(255,255,255,.14); --glass:rgba(16,24,38,.66);
  --emerald-50:rgba(16,185,129,.12); --emerald-100:rgba(16,185,129,.20);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow-md:0 10px 30px -12px rgba(0,0,0,.6); --shadow-lg:0 30px 70px -24px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#FFFFFF; --surface:#F8FAFC; --surface-2:#F1F5F9; --surface-3:#E9EEF5; --card:#FFFFFF;
  --text:#0F172A; --text-2:#475569; --text-3:#94A3B8;
  --border:rgba(15,23,42,.08); --border-2:rgba(15,23,42,.12); --glass:rgba(255,255,255,.72);
  --emerald-50:#ECFDF5; --emerald-100:#D1FAE5;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; line-height:1.5; font-size:15px;}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.02em; text-wrap:balance;}
p{margin:0;}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
a{color:inherit; text-decoration:none;}
.ic{width:20px; height:20px; stroke:currentColor; stroke-width:1.75; fill:none; stroke-linecap:round; stroke-linejoin:round; flex:none;}
.eyebrow{font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--emerald-600);}
.tnum{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border-2); border-radius:99px; border:3px solid transparent; background-clip:content-box;}

/* ============ APP SHELL ============ */
.app{display:grid; grid-template-columns:var(--sidebar) 1fr; min-height:100vh;}
.sidebar{position:sticky; top:0; height:100vh; padding:22px 16px; border-right:1px solid var(--border); background:var(--bg); display:flex; flex-direction:column; gap:5px; overflow-y:auto;}
.brand{display:flex; align-items:center; gap:11px; padding:6px 8px 16px;}
.brand-mark{width:40px; height:40px; flex:none;}
.brand-name{font-weight:700; font-size:20px; letter-spacing:-.03em;}
.brand-name b{color:var(--emerald-600);}
.nav-label{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); padding:14px 12px 6px;}
.nav-item{display:flex; align-items:center; gap:13px; padding:11px 12px; border-radius:var(--r-sm); color:var(--text-2); font-weight:500; font-size:14.5px; transition:.18s var(--ease); width:100%; text-align:left;}
.nav-item:hover{background:var(--surface-2); color:var(--text);}
.nav-item.active{background:var(--emerald-50); color:var(--emerald-700);}
.nav-item.active .ic{stroke:var(--emerald-600);}
.nav-item .badge{margin-left:auto; background:var(--emerald); color:#fff; font-size:11px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:99px; display:grid; place-items:center;}
.side-pro{margin-top:auto; padding:16px; border-radius:var(--r-md); background:linear-gradient(150deg,var(--nuit),#0f2560); color:#fff; position:relative; overflow:hidden;}
.side-pro::after{content:""; position:absolute; right:-30px; bottom:-30px; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle,rgba(16,185,129,.5),transparent 70%);}
.side-pro h4{font-size:15px; margin-bottom:4px;}
.side-pro p{font-size:12.5px; color:rgba(255,255,255,.72); margin-bottom:12px;}
.side-pro .btn-pro{background:var(--emerald); color:#fff; font-weight:600; font-size:13px; padding:9px 14px; border-radius:var(--r-pill); width:100%;}

.main{min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:14px; padding:14px 30px; background:var(--glass); backdrop-filter:saturate(180%) blur(16px); border-bottom:1px solid var(--border);}
.loc-chip{display:flex; align-items:center; gap:8px; padding:9px 14px; border-radius:var(--r-pill); background:var(--surface-2); font-size:13.5px; font-weight:500; color:var(--text-2);}
.loc-chip .ic{width:17px; height:17px; stroke:var(--emerald-600);}
.loc-chip b{color:var(--text); font-weight:600;}
.top-search{flex:1; max-width:480px; display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--surface-2); border:1px solid transparent; border-radius:var(--r-pill); color:var(--text-3); transition:.2s;}
.top-search:focus-within{border-color:var(--emerald); background:var(--card); box-shadow:0 0 0 4px var(--emerald-50);}
.top-search input{border:none; background:none; outline:none; flex:1; font:inherit; font-size:14px; color:var(--text);}
.top-actions{margin-left:auto; display:flex; align-items:center; gap:8px;}
.icon-btn{height:42px; min-width:42px; padding:0 12px; border-radius:var(--r-pill); display:inline-flex; gap:7px; align-items:center; justify-content:center; color:var(--text-2); background:var(--surface-2); transition:.18s var(--ease); font-weight:600; font-size:13px;}
.icon-btn:hover{background:var(--surface-3); color:var(--text); transform:translateY(-1px);}
.icon-btn .ic{width:19px; height:19px;}
.avatar{width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--emerald),var(--nuit)); color:#fff; display:grid; place-items:center; font-weight:600; font-size:15px; flex:none;}

.view{padding:30px; max-width:1240px; width:100%; margin:0 auto;}
.view[hidden]{display:none;}

/* ============ HERO ============ */
.hero{position:relative; border-radius:var(--r-lg); overflow:hidden; padding:56px 48px 46px; background:radial-gradient(1000px 340px at 82% -10%, rgba(16,185,129,.20), transparent 60%),radial-gradient(700px 300px at 0% 120%, rgba(30,58,138,.16), transparent 60%),var(--surface); border:1px solid var(--border); box-shadow:var(--shadow-md);}
.hero::before{content:""; position:absolute; inset:0; background-image:radial-gradient(var(--border) 1px, transparent 1px); background-size:22px 22px; opacity:.5; -webkit-mask-image:linear-gradient(180deg,transparent,#000,transparent);}
.hero-inner{position:relative; max-width:660px;}
.hero h1{font-size:clamp(30px,4.2vw,46px); line-height:1.08; font-weight:700; margin-top:12px;}
.hero h1 .accent{color:var(--emerald-600);}
.hero .lead{color:var(--text-2); font-size:17px; margin-top:14px; max-width:520px;}

  /* -------- Charts -------- */
  function areaChart(vals,color){
    var W=560,H=180,pad=14,max=Math.max.apply(null,vals)*1.15,min=0,n=vals.length;
    function X(i){return pad+i*(W-2*pad)/(n-1);}
    function Y(v){return H-pad-(v-min)/(max-min)*(H-2*pad);}
    var line="";
    vals.forEach(function(v,i){line+=(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)+" ";});
    var area="M"+X(0).toFixed(1)+" "+(H-pad)+" "+line.replace("M","L")+"L"+X(n-1).toFixed(1)+" "+(H-pad)+" Z";
    var grid="";for(var g=1;g<4;g++){var gy=pad+g*(H-2*pad)/4;grid+='<line x1="'+pad+'" y1="'+gy+'" x2="'+(W-pad)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"/>';}
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'"><defs><linearGradient id="ag'+color.replace("#","")+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+color+'" stop-opacity=".28"/><stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
      grid+'<path d="'+area+'" fill="url(#ag'+color.replace("#","")+')"/><path d="'+line+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'+
      '<circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(vals[n-1]).toFixed(1)+'" r="4.5" fill="'+color+'"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(vals[n-1]).toFixed(1)+'" r="8" fill="'+color+'" opacity=".18"/></svg>';
  }
  function barChart(vals,labels,color){
    var W=560,H=190,pad=22,n=vals.length,max=Math.max.apply(null,vals)*1.15,bw=(W-2*pad)/n*.55;
    var bars="";
    vals.forEach(function(v,i){var x=pad+i*(W-2*pad)/n+((W-2*pad)/n-bw)/2;var h=(v/max)*(H-2*pad-16);var y=H-pad-16-h;
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="5" fill="'+color+'" opacity="'+(i===n-1?1:.45)+'"/>';
      bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-4)+'" fill="var(--text-3)" font-size="11" text-anchor="middle" font-family="Poppins">'+labels[i]+'</text>';});
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+bars+'</svg>';
  }
  function donut(segs){
    var C=2*Math.PI*32,off=0,circ="";
    segs.forEach(function(s){var len=s.val/100*C;circ+='<circle cx="42" cy="42" r="32" fill="none" stroke="'+s.color+'" stroke-width="16" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 42 42)"/>';off+=len;});
    return '<svg viewBox="0 0 84 84" width="150" height="150">'+circ+'<text x="42" y="40" text-anchor="middle" font-size="15" font-weight="700" fill="var(--text)" font-family="Poppins">3 640</text><text x="42" y="53" text-anchor="middle" font-size="7.5" fill="var(--text-3)" font-family="Poppins">annonces</text></svg>';
  }

    var segs=[{k:"seg.products",val:52,color:"#10B981"},{k:"seg.services",val:26,color:"#1E3A8A"},{k:"seg.spaces",val:14,color:"#F59E0B"},{k:"seg.other",val:8,color:"#94A3B8"}];
    document.getElementById("donut").innerHTML=donut(segs);
    document.getElementById("donutLegend").innerHTML=segs.map(function(s2){return '<span><i style="background:'+s2.color+'"></i>'+t(s2.k)+' <b>'+s2.val+'%</b></span>';}).join("");
    var mods=[["ic-store","Boutique Kaay Jënd","seg.products"],["ic-tools","Réparation Express","seg.services"],["ic-fork","Fast Food Teranga","seg.spaces"]];
    document.getElementById("modList").innerHTML=mods.map(function(m){
      return '<div class="mini-row"><span class="stat-ic" style="width:38px;height:38px">'+icon(m[0])+'</span><div><div class="r-name">'+m[1]+'</div><div class="r-sub">'+t(m[2])+'</div></div><div class="r-end" style="display:flex;gap:8px;align-items:center"><span class="pill pill-warn">'+t("badge.pending")+'</span><button class="btn btn-outline btn-sm">'+t("mod.review")+'</button></div></div>';
    }).join("");
  }

  /* -------- Messages -------- */
  var convos=[["B","Le Baobab Gourmand","Parfait, à 20h alors !","09:24",true,0],["T","Hôtel Téranga","Votre réservation est confirmée.","Hier",false,2],["D","DépannPro","Le technicien arrive dans 15 min.","Lun",true,0],["P","Pharmacie Plateau","Oui, nous l'avons en stock.","Lun",false,1]];
  var thread=[["in","Bonjour ! Bienvenue au Baobab Gourmand 🌿","09:10"],["out","Bonjour, avez-vous une table pour 2 ce soir ?","09:12"],["in","Oui, à quelle heure souhaitez-vous venir ?","09:14"],["out","Vers 20h si possible.","09:20"],["in","Parfait, à 20h alors !","09:24"]];
  function renderMessages(){
    document.getElementById("convList").innerHTML=convos.map(function(c,i){
      var dot=c[4]?'<span class="on-dot"></span>':'';
      var unread=c[5]?'<span class="unread">'+c[5]+'</span>':'';
      var grad=(i===0)?'style="background:linear-gradient(135deg,#0f766e,#10B981)"':'';
      return '<div class="conv'+(i===0?" active":"")+'"><div class="avatar" '+grad+'>'+c[0]+dot+'</div><div class="conv-info"><h4>'+c[1]+'<time>'+c[3]+'</time></h4><p>'+c[2]+'</p></div>'+unread+'</div>';
    }).join("");
    document.getElementById("chatBody").innerHTML=thread.map(function(m){
      return '<div class="bubble '+(m[0]==="in"?"b-in":"b-out")+'">'+m[1]+'<time>'+m[2]+'</time></div>';
    }).join("");
  }
  function sendMsg(){
    var inp=document.getElementById("chatInput");if(!inp.value.trim())return;
    var now=new Date();var hh=(""+now.getHours()).padStart(2,"0")+":"+(""+now.getMinutes()).padStart(2,"0");
    var b=document.createElement("div");b.className="bubble b-out";b.innerHTML=inp.value.replace(/</g,"&lt;")+'<time>'+hh+'</time>';
    document.getElementById("chatBody").appendChild(b);inp.value="";
    var cb=document.getElementById("chatBody");cb.scrollTop=cb.scrollHeight;showToast(t("toast.sent"));
  }

  function renderAll(){renderCats();renderOffers();renderNear();renderResults();renderDashboard();renderAdmin();renderMessages();applyI18n();}

  /* ================= NAV ================= */
  var views={home:"view-home",explore:"view-explore",detail:"view-detail",dashboard:"view-dashboard",admin:"view-admin",messages:"view-messages"};
  function goto(name){
    Object.keys(views).forEach(function(k){document.getElementById(views[k]).hidden=(k!==name);});
    document.querySelectorAll(".nav-item").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-goto")===name);});
    document.querySelectorAll(".botnav button").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-goto")===name);});
    window.scrollTo({top:0,behavior:"smooth"});revealNow();
  }
  document.addEventListener("click",function(e){
    var g=e.target.closest("[data-goto]");
    if(g){e.preventDefault();goto(g.getAttribute("data-goto"));return;}
    var f=e.target.closest(".fav");
    if(f){f.classList.toggle("on");f.classList.add("pop");setTimeout(function(){f.classList.remove("pop");},400);if(f.classList.contains("on"))showToast(t("toast.fav"));return;}
    var cv=e.target.closest(".conv");
    if(cv){document.querySelectorAll(".conv").forEach(function(c){c.classList.remove("active");});cv.classList.add("active");return;}
  });
  document.getElementById("reserveBtn").addEventListener("click",function(){showToast(t("toast.reserve"));});
  document.getElementById("chatSend").addEventListener("click",sendMsg);
  document.getElementById("chatInput").addEventListener("keydown",function(e){if(e.key==="Enter")sendMsg();});

  /* -------- Toast -------- */
  var toast=document.getElementById("toast"),toastMsg=document.getElementById("toastMsg"),tmr;
  function showToast(msg){toastMsg.innerHTML=msg;toast.classList.add("show");clearTimeout(tmr);tmr=setTimeout(function(){toast.classList.remove("show");},2600);}

  /* -------- Theme -------- */
  var themeBtn=document.getElementById("themeBtn");
  function isDark(){var a=root.getAttribute("data-theme");return a?a==="dark":matchMedia("(prefers-color-scheme:dark)").matches;}
  function updThemeIcon(){themeBtn.innerHTML=icon(isDark()?"ic-sun":"ic-moon");}
  themeBtn.addEventListener("click",function(){root.setAttribute("data-theme",isDark()?"light":"dark");updThemeIcon();});
  try{matchMedia("(prefers-color-scheme:dark)").addEventListener("change",updThemeIcon);}catch(e){}
  updThemeIcon();

  /* -------- Language -------- */
  document.getElementById("langBtn").addEventListener("click",function(){
    lang=(lang==="fr")?"en":"fr";
    document.getElementById("langLabel").textContent=lang.toUpperCase();
    root.setAttribute("lang",lang);
    renderAll();revealNow();
  });

  /* -------- Reveal -------- */
  var io=("IntersectionObserver" in window)?new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{threshold:.12}):null;
  function revealNow(){document.querySelectorAll(".view:not([hidden]) .reveal").forEach(function(el){if(io){io.observe(el);}else{el.classList.add("in");}var r=el.getBoundingClientRect();if(r.top<innerHeight){el.classList.add("in");}});}

  /* ================= INIT ================= */
  renderAll();revealNow();
})();
</script>
