server:
  port: 8086

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Aucune entité propre : tableau de bord et journal sont lus en SQL natif sur la base
      # partagée ; le schéma reste géré par les scripts de database/.
      ddl-auto: none
    show-sql: false

jwt:
  secret: ${JWT_SECRET}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
